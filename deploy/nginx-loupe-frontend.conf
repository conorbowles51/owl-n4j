# Loupe on :@PORT@, served by nginx (installed by deploy/frontend-server.sh; do not edit the installed copy).
#
# Static files come from the frontend build that @RELEASES@/current points at (switched in one step by a release),
# so the site is never down while a release builds. /api is proxied to the backend with exactly the request headers
# the vite preview proxy sent (frontend_v2/vite.config.ts), because the backend's activity trail takes the browser's
# address from them: X-Real-IP overwritten with the socket address, the socket address appended to
# X-Forwarded-For with a bare comma, "http" ("ws" for a websocket) and the port appended to X-Forwarded-Proto /
# X-Forwarded-Port, X-Forwarded-Host kept or set from Host, and Host set to the proxy target (changeOrigin;
# VITE_API_PROXY_TARGET, as vite reads it).

map $http_upgrade $loupe_connection {
    default upgrade;
    ""      "";
}
map $http_x_forwarded_for $loupe_xf_for {
    ""      "$remote_addr";
    default "$http_x_forwarded_for,$remote_addr";
}
map $http_upgrade $loupe_scheme {
    default "ws";
    ""      "http";
}
map $http_x_forwarded_proto $loupe_xf_proto {
    ""      "$loupe_scheme";
    default "$http_x_forwarded_proto,$loupe_scheme";
}
map $http_x_forwarded_port $loupe_xf_port {
    ""      "$server_port";
    default "$http_x_forwarded_port,$server_port";
}
map $http_x_forwarded_host $loupe_xf_host_http {
    ""      "$http_host";
    default "$http_x_forwarded_host";
}
# The vite proxy sets X-Forwarded-Host on plain requests only; a websocket passes the browser's own (if any).
map $http_upgrade $loupe_xf_host {
    ""      "$loupe_xf_host_http";
    default "$http_x_forwarded_host";
}

server {
    listen @PORT@;
    server_name _;
    root @RELEASES@/current;

    # vite preview (node) accepted these; nginx's defaults are smaller or stricter.
    underscores_in_headers on;
    large_client_header_buffers 8 32k;
    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;
    server_tokens off;
    access_log /var/log/nginx/loupe-frontend.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/loupe-frontend.error.log warn;

    location /api {
        proxy_pass http://@API@;
        proxy_http_version 1.1;
        proxy_set_header Host "@API_HOST@";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $loupe_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $loupe_xf_for;
        proxy_set_header X-Forwarded-Proto $loupe_xf_proto;
        proxy_set_header X-Forwarded-Port $loupe_xf_port;
        proxy_set_header X-Forwarded-Host $loupe_xf_host;
        # Streams (event streams, long exports, uploads) pass through as they arrive, as with the node proxy.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        # The backend compresses its own responses; never a second time here.
        gzip off;
    }

    # Hashed file names never change content: cached for good. Files of the last few builds stay here, so a tab
    # opened before a release can still load a page it had not opened. A missing file is a real 404.
    location /assets/ {
        alias @RELEASES@/assets/;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (index.html, version.json, files from public/) is checked on every load; unknown paths are
    # the app's own routes.
    location / {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
