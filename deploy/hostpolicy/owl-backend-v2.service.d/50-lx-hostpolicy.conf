# lx-hostpolicy (WS-A, LOUPE-PERFORMANCE-PLAN.md). Sizes from the memory table in /mnt/owl-data/fin-wt/headless/LX-HOSTPOLICY-STATUS.md.
[Service]
Slice=loupe-live.slice
MemoryLow=6G
# Hard floor (memory.min) at the same size: memory.low is best effort and the kernel ignored it on 1 Nov 00:16 (1.4 GB
# of the backend swapped out at 3.6 GB use; request stalls of 5-6 s on swap-in). Parents carry the sum in MemoryMin.
MemoryMin=6G
