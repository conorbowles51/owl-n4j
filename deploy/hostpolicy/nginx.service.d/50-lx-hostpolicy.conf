# lx-hostpolicy (WS-A, LOUPE-PERFORMANCE-PLAN.md). nginx serves Loupe on :5174 (static build + /api proxy) since
# d4b74875, so every request crosses it. In system.slice, 31 Oct 03:10 (60 s): 51 ms CPU, 2,166 ms waiting for CPU.
# Releases only reload nginx; the slice move takes effect at its next restart. It also serves the cbm site on :80.
[Service]
Slice=loupe-live.slice
MemoryLow=64M
