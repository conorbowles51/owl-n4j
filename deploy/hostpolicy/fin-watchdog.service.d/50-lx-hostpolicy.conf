# lx-hostpolicy (WS-A, LOUPE-PERFORMANCE-PLAN.md). Sizes from the memory table in /mnt/owl-data/fin-wt/headless/LX-HOSTPOLICY-STATUS.md.
# Stays in system.slice: with KillMode=process its running jobs are left-over processes, and systemd keeps a unit
# with left-overs in its old cgroup, so a Slice= move would never take effect. cpu.idle=1: the jobs run only on CPU
# that every non-idle group leaves.
[Service]
CPUWeight=idle
IOWeight=25
MemoryHigh=14G
MemorySwapMax=10G
