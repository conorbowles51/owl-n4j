<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080A" />
    <meta
      name="description"
      content="Loupe resolves phone extractions, documents, financial records and audio into one connected model of the case — so a question reaches all of it at once, and every answer carries the file, page and passage behind it."
    />
    <meta property="og:title" content="Loupe — Query the whole case" />
    <meta
      property="og:description"
      content="An investigation platform for fraud and criminal casework. Phone, document and financial evidence in one connected model, every claim traceable to its source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/loupe-red-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Loupe — Query the whole case</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const savedTheme = window.localStorage.getItem("loupe-theme")
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light"
      } catch {
        document.documentElement.dataset.theme = "light"
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
